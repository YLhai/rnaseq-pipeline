[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaseq-pipeline"
version = "0.1.9"
description = "A reusable RNA-seq pipeline: fastp, HISAT2, featureCounts, DESeq2, annotation and enrichment"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "rnaseq-pipeline contributors" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
rnaseq-pipeline = "rnaseq_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rnaseq_pipeline = ["R/*.R", "templates/*"]
